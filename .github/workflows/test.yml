name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Та же версия Node, на которой тесты прогонялись локально.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"

      - run: node --test
