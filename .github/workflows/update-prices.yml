name: Update BTC prices

on:
  schedule:
    # 02:30 UTC — с запасом после полуночи, чтобы данные за вчерашний
    # день у источника уже точно появились.
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: node scripts/update-btc-prices.js

      # Страницы собираются из шаблона и strings.js; здесь это страховка,
      # чтобы они не разошлись с источником, если кто-то забыл собрать.
      - run: node scripts/build-pages.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/btc-usd-daily.json index.html en/index.html; then
            echo "Ничего не изменилось, коммитить нечего."
            exit 0
          fi
          git config user.name "vimakushin"
          git config user.email "99874293+vimakushin@users.noreply.github.com"
          git add data/btc-usd-daily.json index.html en/index.html
          git commit -m "Обновление цен BTC $(date -u +%Y-%m-%d)"
          git push
